/* ─── TopNav ─────────────────────────────────────────────────────────── */
function TopNav({ title, subtitle, initials, onMenuOpen, onProfileOpen, onProfileClose, onBack, badge, profileOpen }) {
  const { C, sh, ff } = window;

  if (profileOpen) {
    return (
      <div style={{ position: "absolute", top: 0, left: 0, right: 0, zIndex: 70,
                    background: C.white, borderBottom: `1px solid ${C.border}`,
                    padding: "14px 18px 12px", display: "flex", alignItems: "center", gap: 12 }}>
        <div style={{ flex: 1, minWidth: 0 }}>
          <div style={{ color: C.text, fontSize: 15, fontWeight: 800, fontFamily: ff.serif }}>Meu Perfil</div>
          <div style={{ color: C.muted, fontSize: 11, fontFamily: ff.sans, marginTop: 1 }}>Toque no ✕ para fechar</div>
        </div>
        <button onClick={onProfileClose} aria-label="Fechar perfil"
          style={{ width: 38, height: 38, borderRadius: "50%",
                   background: "#000", color: C.white,
                   border: "none", cursor: "pointer", flexShrink: 0,
                   display: "flex", alignItems: "center", justifyContent: "center",
                   boxShadow: sh.md, fontSize: 14, fontWeight: 700,
                   transition: "transform 0.2s" }}>
          ✕
        </button>
      </div>
    );
  }

  return (
    <div style={{ position: "absolute", top: 0, left: 0, right: 0, zIndex: 40,
                  background: C.white, borderBottom: `1px solid ${C.border}`,
                  padding: "14px 18px 12px", display: "flex", alignItems: "center", gap: 12 }}>
      {onBack ? (
        <button onClick={onBack}
          style={{ width: 38, height: 38, borderRadius: 12, background: C.bg, border: `1px solid ${C.border}`,
                   display: "flex", alignItems: "center", justifyContent: "center",
                   cursor: "pointer", flexShrink: 0, boxShadow: sh.sm }}>
          <span style={{ fontSize: 16, color: C.text }}>←</span>
        </button>
      ) : (
        <button onClick={onMenuOpen}
          style={{ width: 38, height: 38, borderRadius: 12, background: C.bg, border: `1px solid ${C.border}`,
                   display: "flex", alignItems: "center", justifyContent: "center",
                   cursor: "pointer", flexShrink: 0, boxShadow: sh.sm }}>
          <span style={{ fontSize: 16 }}>☰</span>
        </button>
      )}
      <div style={{ flex: 1, minWidth: 0 }}>
        <div style={{ color: C.text, fontSize: 15, fontWeight: 800, fontFamily: ff.serif,
                      whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>{title}</div>
        {subtitle && <div style={{ color: C.muted, fontSize: 11, fontFamily: ff.sans, marginTop: 1 }}>{subtitle}</div>}
      </div>
      {initials && (
        <div onClick={onProfileOpen} style={{ position: "relative", cursor: "pointer", flexShrink: 0 }}>
          <div style={{ width: 38, height: 38, borderRadius: "50%",
                        background: `linear-gradient(135deg, ${C.primary}, #FF8C5A)`,
                        display: "flex", alignItems: "center", justifyContent: "center",
                        border: `2px solid ${C.primaryMid}`, boxShadow: sh.sm }}>
            <span style={{ color: C.white, fontSize: 13, fontWeight: 800, fontFamily: ff.serif }}>{initials}</span>
          </div>
          {badge && <div style={{ position: "absolute", top: -1, right: -1, width: 10, height: 10,
                                  borderRadius: "50%", background: C.success, border: `2px solid ${C.white}` }} />}
        </div>
      )}
    </div>
  );
}

/* ─── InboxSheet ─────────────────────────────────────────────────────── */
const { useEffect: useEffectIS, useMemo: useMemoIS, useState: useStateIS } = React;
function InboxSheet({ open, onClose, role = "cliente", peer, provider, contextLabel }) {
  const { C, sh, ff } = window;
  const hydratedProvider = provider ? window.enrichProvider(provider, provider.id || 0) : null;
  const [draft, setDraft] = useStateIS("");
  const [messages, setMessages] = useStateIS(hydratedProvider?.inboxThread || [
    { from: "cliente", author: "Ricardo Almeida", text: "Quero alinhar os detalhes por aqui.", time: "09:20" },
    { from: "prestador", author: peer || "Equipe", text: "Pode me passar o bairro e os objetos.", time: "09:23" },
  ]);
  useEffectIS(() => {
    if (!open) return;
    setDraft("");
    setMessages(hydratedProvider?.inboxThread || [
      { from: "cliente", author: "Ricardo Almeida", text: "Quero alinhar os detalhes por aqui.", time: "09:20" },
      { from: "prestador", author: peer || "Equipe", text: "Pode me passar o bairro e os objetos.", time: "09:23" },
    ]);
  }, [open, hydratedProvider?.id, peer]);

  const violations = useMemoIS(() => {
    if (!draft.trim()) return [];
    const found = [];
    if (/\b(pin|senha|c[oó]digo)\b/i.test(draft)) found.push("PIN/código");
    if (/\b(cpf)\b/i.test(draft) || /\b\d{3}\.?\d{3}\.?\d{3}\-?\d{2}\b/.test(draft)) found.push("CPF");
    if (/@|\.com\b|\.br\b/i.test(draft) || /\b(email|e-mail)\b/i.test(draft)) found.push("e-mail");
    if (/\b(telefone|celular|whatsapp|contato)\b/i.test(draft) || /\b\d{8,}\b/.test(draft)) found.push("telefone");
    return [...new Set(found)];
  }, [draft]);

  if (!open) return null;

  return (
    <>
      <div onClick={onClose}
        style={{ position: "absolute", inset: 0, zIndex: 92,
                 background: "rgba(0,0,0,0.42)", backdropFilter: "blur(3px)" }} />
      <div style={{ position: "absolute", left: 0, right: 0, bottom: 0, zIndex: 93,
                    background: C.white, borderRadius: "24px 24px 0 0",
                    boxShadow: sh.xl, overflow: "hidden",
                    animation: "mps-up 0.28s cubic-bezier(0.32,0.72,0,1)" }}>
        <div style={{ padding: "8px 0 0" }}>
          <div style={{ width: 38, height: 4, borderRadius: 2, background: "#D6D3D1", margin: "0 auto" }} />
        </div>
        <div style={{ padding: "14px 18px 16px", borderBottom: `1px solid ${C.borderLight}`,
                      display: "flex", alignItems: "center", gap: 12 }}>
          <div style={{ width: 42, height: 42, borderRadius: 14, background: hydratedProvider ? `${hydratedProvider.color}18` : C.bg,
                        display: "flex", alignItems: "center", justifyContent: "center",
                        color: hydratedProvider?.color || C.text, fontWeight: 800, fontFamily: ff.serif }}>
            {hydratedProvider?.ini || "IN"}
          </div>
          <div style={{ flex: 1, minWidth: 0 }}>
            <div style={{ color: C.text, fontSize: 15, fontWeight: 800, fontFamily: ff.serif }}>Inbox</div>
            <div style={{ color: C.muted, fontSize: 11, fontFamily: ff.sans }}>
              {contextLabel || "Mensagens básicas"} · {peer || hydratedProvider?.name || "Contato"}
            </div>
          </div>
          <button onClick={onClose}
            style={{ width: 32, height: 32, borderRadius: "50%", border: "none",
                     background: C.bg, color: C.sub, cursor: "pointer", fontSize: 14 }}>✕</button>
        </div>

        <div style={{ padding: "14px 18px 12px", background: C.bg, borderBottom: `1px solid ${C.borderLight}` }}>
          <div style={{ display: "flex", gap: 8, overflowX: "auto" }}>
            {[
              `Assunto: ${contextLabel || "Detalhes do serviço"}`,
              role === "cliente" ? "Caixa de saída do cliente" : "Caixa de entrada do prestador",
              "Só mensagens pela plataforma",
            ].map((chip, index) => (
              <span key={index}
                style={{ flexShrink: 0, background: C.white, border: `1px solid ${C.border}`,
                         borderRadius: 999, padding: "6px 10px", color: C.sub,
                         fontSize: 11, fontFamily: ff.sans }}>{chip}</span>
            ))}
          </div>
        </div>

        <div style={{ maxHeight: 290, overflowY: "auto", padding: "16px 18px 8px", background: "#FCFBF9" }}>
          {messages.map((message, index) => {
            const mine = message.from === role;
            return (
              <div key={`${message.time}-${index}`}
                style={{ display: "flex", justifyContent: mine ? "flex-end" : "flex-start", marginBottom: 10 }}>
                <div style={{ maxWidth: "82%", background: mine ? C.text : C.white,
                              color: mine ? C.white : C.text,
                              borderRadius: 18, padding: "10px 12px",
                              border: mine ? "none" : `1px solid ${C.border}`,
                              boxShadow: mine ? "none" : sh.sm }}>
                  <div style={{ fontSize: 10, fontWeight: 700, fontFamily: ff.sans,
                                color: mine ? "rgba(255,255,255,0.72)" : C.muted, marginBottom: 4 }}>
                    {message.author}
                  </div>
                  <div style={{ fontSize: 12, fontFamily: ff.sans, lineHeight: 1.55 }}>{message.text}</div>
                  <div style={{ marginTop: 6, fontSize: 10, fontFamily: ff.sans,
                                color: mine ? "rgba(255,255,255,0.72)" : C.muted, textAlign: "right" }}>
                    {message.time}
                  </div>
                </div>
              </div>
            );
          })}
        </div>

        <div style={{ padding: "14px 18px 18px", borderTop: `1px solid ${C.borderLight}`, background: C.white }}>
          <div style={{ background: C.bg, borderRadius: 16, padding: "10px 12px",
                        border: `1px solid ${violations.length ? "#FCA5A5" : C.border}` }}>
            <textarea value={draft} onChange={(e) => setDraft(e.target.value)}
              placeholder="Escreva apenas mensagens básicas sobre horário, local e objetos."
              style={{ width: "100%", minHeight: 78, resize: "none", border: "none",
                       outline: "none", background: "transparent",
                       color: C.text, fontSize: 12, fontFamily: ff.sans, lineHeight: 1.5 }} />
          </div>
          <div style={{ display: "flex", justifyContent: "space-between", gap: 10, marginTop: 10, alignItems: "center" }}>
            <div style={{ flex: 1, color: violations.length ? "#B91C1C" : C.muted, fontSize: 10, fontFamily: ff.sans, lineHeight: 1.5 }}>
              {violations.length
                ? `Bloqueado: remova ${violations.join(", ")}.`
                : "Bloqueado no inbox: telefone, PIN, CPF e e-mail."}
            </div>
            <button
              onClick={() => {
                if (!draft.trim() || violations.length) return;
                setMessages((current) => [...current, {
                  from: role,
                  author: role === "cliente" ? "Ricardo Almeida" : hydratedProvider?.name || "Prestador",
                  text: draft.trim(),
                  time: "agora",
                }]);
                setDraft("");
              }}
              style={{ height: 42, minWidth: 112, borderRadius: 12,
                       border: "none", cursor: violations.length || !draft.trim() ? "not-allowed" : "pointer",
                       background: violations.length || !draft.trim() ? "#E7E5E4" : hydratedProvider?.color || C.primary,
                       color: violations.length || !draft.trim() ? C.muted : C.white,
                       fontSize: 12, fontWeight: 800, fontFamily: ff.sans }}>
              Enviar →
            </button>
          </div>
        </div>
      </div>
    </>
  );
}

/* ─── ScheduleModal ──────────────────────────────────────────────────── */
const { useEffect: useEffectSCH, useMemo: useMemoSCH, useState: useStateSCH } = React;
function ScheduleModal({ open, onClose, provider, onOpenInbox }) {
  const { C, sh, ff } = window;
  const hydratedProvider = provider ? window.enrichProvider(provider, provider.id || 0) : null;
  const [selectedDay, setSelectedDay] = useStateSCH(0);
  const [selectedWindow, setSelectedWindow] = useStateSCH("08h - 10h");
  const [step, setStep] = useStateSCH("form");
  const days = useMemoSCH(() => {
    const formatterDay = new Intl.DateTimeFormat("pt-BR", { weekday: "short" });
    const formatterDate = new Intl.DateTimeFormat("pt-BR", { day: "2-digit", month: "2-digit" });
    return Array.from({ length: 7 }, (_, index) => {
      const day = new Date();
      day.setDate(day.getDate() + index);
      return {
        key: index,
        label: formatterDay.format(day).replace(".", ""),
        date: formatterDate.format(day),
        full: day.toISOString(),
      };
    });
  }, [open]);
  useEffectSCH(() => {
    if (!open) return;
    setSelectedDay(0);
    setSelectedWindow("08h - 10h");
    setStep("form");
  }, [open, hydratedProvider?.id]);
  const timeWindows = ["08h - 10h", "10h - 12h", "13h - 15h", "15h - 18h", "18h - 20h"];

  if (!open || !hydratedProvider) return null;

  return (
    <>
      <div onClick={onClose}
        style={{ position: "absolute", inset: 0, zIndex: 90,
                 background: "rgba(0,0,0,0.48)", backdropFilter: "blur(4px)" }} />
      <div style={{ position: "absolute", left: "50%", top: "50%", transform: "translate(-50%,-50%)",
                    width: "calc(100% - 24px)", maxWidth: 362, zIndex: 91,
                    background: C.white, borderRadius: 24, overflow: "hidden", boxShadow: sh.xl }}>
        <div style={{ padding: "18px 18px 16px", background: `linear-gradient(160deg, ${hydratedProvider.color}18 0%, ${C.white} 100%)` }}>
          <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
            <div style={{ width: 48, height: 48, borderRadius: 16, background: `${hydratedProvider.color}18`,
                          display: "flex", alignItems: "center", justifyContent: "center",
                          color: hydratedProvider.color, fontSize: 22 }}>
              📅
            </div>
            <div style={{ flex: 1 }}>
              <div style={{ color: C.text, fontSize: 18, fontWeight: 800, fontFamily: ff.serif }}>Agendar serviço</div>
              <div style={{ color: C.muted, fontSize: 11, fontFamily: ff.sans }}>
                {hydratedProvider.name} · agenda aberta por até 7 dias
              </div>
            </div>
            <button onClick={onClose}
              style={{ width: 32, height: 32, borderRadius: "50%", border: "none",
                       background: C.white, color: C.sub, cursor: "pointer", boxShadow: sh.sm }}>✕</button>
          </div>
        </div>

        {step === "form" ? (
          <div style={{ padding: "16px 18px 18px" }}>
            <div style={{ color: C.sub, fontSize: 10, fontWeight: 700, letterSpacing: 0.8, fontFamily: ff.sans, marginBottom: 10 }}>ESCOLHA A DATA</div>
            <div style={{ display: "flex", gap: 8, overflowX: "auto", marginBottom: 16 }}>
              {days.map((day) => {
                const active = day.key === selectedDay;
                return (
                  <button key={day.full} onClick={() => setSelectedDay(day.key)}
                    style={{ flexShrink: 0, width: 76, borderRadius: 18, padding: "10px 8px",
                             border: active ? "none" : `1px solid ${C.border}`,
                             background: active ? hydratedProvider.color : C.bg,
                             color: active ? C.white : C.text, cursor: "pointer" }}>
                    <div style={{ fontSize: 11, fontWeight: 700, fontFamily: ff.sans, textTransform: "capitalize" }}>{day.label}</div>
                    <div style={{ fontSize: 15, fontWeight: 800, fontFamily: ff.serif, marginTop: 2 }}>{day.date}</div>
                  </button>
                );
              })}
            </div>

            <div style={{ color: C.sub, fontSize: 10, fontWeight: 700, letterSpacing: 0.8, fontFamily: ff.sans, marginBottom: 10 }}>JANELA DE HORÁRIO</div>
            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8, marginBottom: 16 }}>
              {timeWindows.map((windowLabel) => {
                const active = windowLabel === selectedWindow;
                return (
                  <button key={windowLabel} onClick={() => setSelectedWindow(windowLabel)}
                    style={{ height: 42, borderRadius: 12, cursor: "pointer",
                             border: active ? "none" : `1px solid ${C.border}`,
                             background: active ? C.text : C.white,
                             color: active ? C.white : C.sub,
                             fontSize: 12, fontWeight: 700, fontFamily: ff.sans }}>
                    {windowLabel}
                  </button>
                );
              })}
            </div>

            <div style={{ background: C.bg, borderRadius: 16, padding: "14px 14px", border: `1px solid ${C.border}`, marginBottom: 16 }}>
              <div style={{ color: C.text, fontSize: 13, fontWeight: 700, fontFamily: ff.sans }}>Fluxo do agendamento</div>
              <div style={{ color: C.muted, fontSize: 11, fontFamily: ff.sans, lineHeight: 1.6, marginTop: 6 }}>
                O cliente envia uma proposta com data. O prestador responde pela inbox com aceite ou contraproposta, definindo horário final, local e objetos.
              </div>
            </div>

            <div style={{ display: "flex", gap: 10 }}>
              <button onClick={onClose}
                style={{ flex: 1, height: 46, borderRadius: 14, background: C.bg, border: `1px solid ${C.border}`,
                         color: C.sub, fontSize: 13, fontWeight: 700, fontFamily: ff.sans, cursor: "pointer" }}>

              <button onClick={() => setStep("sent")}
                style={{ flex: 2, height: 46, borderRadius: 14, background: hydratedProvider.color,

          </div>
        ) : (
          <div style={{ padding: "20px 18px 18px" }}>
            <div style={{ width: 64, height: 64, borderRadius: "50%", background: C.successLight,
                          display: "flex", alignItems: "center", justifyContent: "center",

            <div style={{ textAlign: "center", marginBottom: 16 }}>
              <div style={{ color: C.text, fontSize: 20, fontWeight: 800, fontFamily: ff.serif }}>Proposta enviada</div>
              <div style={{ color: C.muted, fontSize: 12, fontFamily: ff.sans, lineHeight: 1.6, marginTop: 6 }}>

            <div style={{ background: C.bg, borderRadius: 16, padding: "14px 14px", border: `1px solid ${C.border}`, marginBottom: 14 }}>
              <div style={{ color: C.sub, fontSize: 10, fontWeight: 700, letterSpacing: 0.8, fontFamily: ff.sans, marginBottom: 8 }}>PRÓXIMOS PASSOS</div>
              <div style={{ color: C.text, fontSize: 12, fontFamily: ff.sans, lineHeight: 1.65 }}>
                1. Prestador visualiza a proposta na inbox.
                <br />
                2. Ele pode aceitar ou mandar contraproposta.
                <br />
                3. Cliente confirma condições finais dentro do app.
              </div>
            </div>
            <div style={{ display: "flex", gap: 10 }}>
              <button onClick={onClose}
                style={{ flex: 1, height: 46, borderRadius: 14, background: C.bg, border: `1px solid ${C.border}`,
                         color: C.sub, fontSize: 13, fontWeight: 700, fontFamily: ff.sans, cursor: "pointer" }}>
                Fechar
              </button>
              <button onClick={() => { onClose(); onOpenInbox && onOpenInbox(); }}

                         border: `1px solid ${hydratedProvider.color}`, color: hydratedProvider.color,
                         fontSize: 13, fontWeight: 800, fontFamily: ff.sans, cursor: "pointer" }}>
                Abrir inbox
              </button>
            </div>
          </div>
        )}
      </div>
    </>
  );
}

/* ─── App shell ──────────────────────────────────────────────────────── */
const { useState: useStateApp } = React;

const BASE_SCREENS = {
  auth: { label: "Auth" },
  home: { label: "Home" },
  marketplace: { label: "Marketplace" },
  support: { label: "Suporte" },
};

function App() {
  const { C, sh, ff } = window;
  const [role, setRole] = useStateApp("cliente");
  const [screen, setScreen] = useStateApp("auth");
  const [serviceOpen, setServiceOpen] = useStateApp(false);
  const screenLabel = screen === "home"
    ? `Home · ${role === "cliente" ? "Cliente" : "Prestador"}`
    : screen === "marketplace"
      ? `Marketplace · ${role === "cliente" ? "Cliente" : "Prestador"}`
      : screen === "support"
        ? `Suporte · ${role === "cliente" ? "Cliente" : "Prestador"}`
        : "Auth";

  const screenNode = screen === "auth"
    ? <AuthScreen role={role} onChooseRole={setRole} onContinue={setScreen} />
    : screen === "home"
      ? role === "cliente"
        ? <ClientHome onNav={setScreen} onServiceOpen={() => setServiceOpen(true)} />
        : <ProviderHome onNav={setScreen} onServiceOpen={() => setServiceOpen(true)} />
      : screen === "marketplace"
        ? role === "cliente"
          ? <Marketplace onNav={setScreen} onServiceOpen={() => setServiceOpen(true)} />
          : <ProviderMarketplace onNav={setScreen} onServiceOpen={() => setServiceOpen(true)} />
        : <SupportHub role={role} onBack={() => setScreen("home")} onServiceOpen={() => setServiceOpen(true)} />;

  return (
    <div style={{ minHeight: "100vh", background: "#E2DDD8", display: "flex",
                  flexDirection: "column", alignItems: "center",
                  padding: "24px 16px 40px", fontFamily: ff.sans }}>
      <div style={{ marginBottom: 20, textAlign: "center" }}>
        <div style={{ display: "inline-flex", alignItems: "center", gap: 8, background: C.white,
                      borderRadius: 20, padding: "6px 14px 6px 8px", boxShadow: sh.sm, marginBottom: 6 }}>
          <div style={{ width: 26, height: 26, borderRadius: 8, background: C.primary,
                        display: "flex", alignItems: "center", justifyContent: "center", fontSize: 13 }}>📦</div>
          <span style={{ fontFamily: ff.serif, fontSize: 17, fontWeight: 800, color: C.text }}>Ajudaê</span>
          <span style={{ background: C.primaryLight, color: C.primary, fontSize: 9, fontWeight: 700,
                         padding: "2px 7px", borderRadius: 8 }}>v6 · NATIVO</span>
        </div>
        <div style={{ color: "#8B7355", fontSize: 11, fontFamily: ff.sans }}>
          Tela: <strong style={{ color: "#5C4A30" }}>{screenLabel}</strong>
        </div>
      </div>

      {screen !== "auth" && (
        <div style={{ display: "flex", gap: 4, marginBottom: 10, background: C.white,
                      padding: 4, borderRadius: 16, boxShadow: sh.sm }}>
          {[
            { key: "cliente", label: "Role cliente" },
            { key: "prestador", label: "Role prestador" },
          ].map((item) => (
            <button key={item.key} onClick={() => setRole(item.key)}
              style={{ padding: "7px 12px", borderRadius: 12, border: "none",
                       background: role === item.key ? C.text : "transparent",
                       color: role === item.key ? C.white : C.muted,
                       fontSize: 11, fontWeight: 700, fontFamily: ff.sans, cursor: "pointer" }}>
              {item.label}
            </button>
          ))}
        </div>
      )}

      <div style={{ display: "flex", gap: 4, marginBottom: 20, background: C.white,
                    padding: 4, borderRadius: 16, boxShadow: sh.sm }}>
        {Object.entries(BASE_SCREENS).map(([key, val]) => (
          <button key={key} onClick={() => setScreen(key)}
            style={{ padding: "8px 14px", borderRadius: 12, border: "none", fontSize: 11, fontWeight: 700,
                     cursor: "pointer", fontFamily: ff.sans,
                     background: screen === key ? C.text : "transparent",
                     color: screen === key ? C.white : C.muted,
                     transition: "all 0.2s" }}>
            {val.label}
          </button>
        ))}
      </div>

      {/* Phone frame */}
      <div style={{ width: 390, height: 820, borderRadius: 50, background: C.white,
                    border: "10px solid #1C1917",
                    boxShadow: "0 40px 80px rgba(0,0,0,0.35), inset 0 0 0 1px #2C2420",
                    position: "relative", overflow: "hidden", flexShrink: 0 }}>
        {/* Notch */}
        <div style={{ position: "absolute", top: 12, left: "50%", transform: "translateX(-50%)",
                      width: 120, height: 34, background: "#1C1917", borderRadius: 17, zIndex: 100 }} />
        {/* Status bar */}
        <div style={{ position: "absolute", top: 0, left: 0, right: 0, height: 50,
                      display: "flex", alignItems: "flex-end", justifyContent: "space-between",
                      padding: "0 26px 7px", zIndex: 99 }}>
          <span style={{ color: C.text, fontSize: 12, fontWeight: 700, fontFamily: ff.sans }}>9:41</span>
          <span style={{ color: C.text, fontSize: 10 }}>●●●●</span>
        </div>
        {/* Screen area */}
        <div style={{ position: "absolute", top: 50, left: 0, right: 0, bottom: 0, overflow: "hidden" }}>
          {screenNode}
        </div>
        <ServiceFlowHub open={serviceOpen} onClose={() => setServiceOpen(false)} role={role} />
        {/* Home bar */}
        <div style={{ position: "absolute", bottom: 8, left: "50%", transform: "translateX(-50%)",
                      width: 120, height: 5, borderRadius: 3, background: "#1C1917", zIndex: 100 }} />
      </div>

      <div style={{ marginTop: 14, color: "#8B7355", fontSize: 11, textAlign: "center",
                    fontFamily: ff.sans, maxWidth: 420, lineHeight: 1.7 }}>
          <strong>Fluxo v8:</strong><br/>
          ① Auth com escolha de role e entrada simplificada<br/>
          ② Home e marketplace trocando por role sem inflar o número de telas<br/>
          ③ Suporte geral concentra inbox, tickets, termos e suporte especializado<br/>
          ④ Fluxo do serviço agora mostra apenas as telas reais de cliente e prestador até a conclusão
        </div>
      </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>

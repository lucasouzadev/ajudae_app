kind = "mobile"
previewPath = "/"
title = "Fretex"
version = "1.0.0"
id = "artifacts/fretex"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/" ]
localPort = 19936

[services.development]
run = "pnpm --filter @workspace/fretex run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/fretex", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/fretex", "run", "serve" ]

[services.env]
PORT = "19936"
BASE_PATH = "/"
